<h1>🛍 Purchase Entry</h1>

</div>

<div class="dashboard-section">

<form id="purchaseForm">

<label>Supplier</label>
<input type="text" id="supplier" required>

<label>Material</label>
<input type="text" id="material" required>

<label>Quantity</label>
<input type="number" id="qty" required>

<label>Rate</label>
<input type="number" id="rate" required>

<label>Paid Amount</label>
<input type="number" id="paid" value="0">

<button type="submit">

Save Purchase

</button>

</form>

<hr>

<h2>Purchase List</h2>

<div class="table-box">

<table>

<thead>

<tr>

<th>Date</th>
<th>Supplier</th>
<th>Material</th>
<th>Qty</th>
<th>Total</th>
<th>Due</th>

</tr>

</thead>

</tbody>
