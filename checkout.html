<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Checkout | AB Furniture Udhyog</title>

<link rel="stylesheet" href="css/style.css">

<link rel="preconnect" href="https://fonts.googleapis.com">

<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">

</head>

<body>

<header>

<div class="logo">
<h1>AB Furniture Udhyog</h1>
</div>

</header>

<section class="checkout">

<h1>Checkout</h1>

<div class="checkout-container">

<div class="billing">

<h2>Billing Details</h2>

<input type="text" placeholder="Full Name">

<input type="email" placeholder="Email">

<input type="tel" placeholder="Phone Number">

<textarea placeholder="Delivery Address"></textarea>

</div>

<div class="payment">

<h2>Payment Method</h2>

<label><input type="radio" name="pay"> Cash on Delivery</label>

<label><input type="radio" name="pay"> eSewa</label>

<label><input type="radio" name="pay"> Khalti</label>

<label><input type="radio" name="pay"> FonePay</label>

<label><input type="radio" name="pay"> Credit Card</label>

<label><input type="radio" name="pay"> QR Payment</label>

<h2>Order Summary</h2>

<p>Subtotal : Rs. 49,500</p>

<p>Delivery : FREE</p>

<h3>Total : Rs. 49,500</h3>

<button class="place-order">

Place Order

</button>

</div>

</div>

</section>

<script src="js/checkout.js"></script>

</body>

</html>
